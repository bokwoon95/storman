<title>Storman data</title>
<header>
  <h1>SharePoint Storage Metrics</h1>
  <span id="status">Loading SQLite…</span>
  <label>
    Open another database:
    <input id="database-file" type="file" accept=".db,.sqlite,.sqlite3,application/vnd.sqlite3">
  </label>
</header>
<div class="workspace">
  <div class="tree-pane">
    <div class="tree-controls">
      <button id="uncheck-all" type="button" disabled>Uncheck all</button>
    </div>
    <div id="file-tree" aria-label="Files and folders"></div>
  </div>
  <div class="chart-pane">
    <div class="chart-controls" role="radiogroup" aria-label="Scale">
      <span>Y-axis:</span>
      <label><input type="radio" name="y-axis-type" value="change-in-size" checked> Change in size</label>
      <label><input type="radio" name="y-axis-type" value="size"> Size</label>
    </div>
    <div id="chart" role="button" tabindex="0" aria-label="Size over time for selected files and folders; click to open a database"></div>
  </div>
</div>
<div class="table-controls">
  <textarea id="query-text" rows="5" spellcheck="false" disabled></textarea>
  <button id="run-query" type="button" disabled>Run Query</button>
</div>
<div class="table-wrapper">
  <table id="results"></table>
</div>
